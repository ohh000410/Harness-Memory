<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#24292F"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="#FFFFFF"/>

  <!-- phase labels -->
  <g font-size="26" font-weight="700" fill="#1F2328">
    <text x="40" y="54">세션 시작</text>
    <text x="516" y="54">폴더 메모리</text>
    <text x="1216" y="54">매일 밤 정리</text>
  </g>

  <!-- panels -->
  <rect x="24" y="72" width="356" height="500" rx="28" fill="#EAF2FF" stroke="#A9C4F5" stroke-width="2" stroke-dasharray="10 7"/>
  <rect x="500" y="72" width="630" height="500" rx="28" fill="#FFF3EC" stroke="#F2C3A8" stroke-width="2" stroke-dasharray="10 7"/>
  <rect x="1200" y="72" width="376" height="500" rx="28" fill="#EAF6EC" stroke="#A8D5B1" stroke-width="2" stroke-dasharray="10 7"/>

  <!-- panel 1: harness chips -->
  <g font-size="26" font-weight="700" fill="#1F2328">
    <rect x="52" y="130" width="296" height="80" rx="16" fill="#FFFFFF" stroke="#D0D7DE"/>
    <rect x="52" y="130" width="12" height="80" rx="6" fill="#D97757"/>
    <text x="84" y="179">Claude Code</text>
    <rect x="52" y="250" width="296" height="80" rx="16" fill="#FFFFFF" stroke="#D0D7DE"/>
    <rect x="52" y="250" width="12" height="80" rx="6" fill="#24292F"/>
    <text x="84" y="299">Codex</text>
    <rect x="52" y="370" width="296" height="80" rx="16" fill="#FFFFFF" stroke="#D0D7DE"/>
    <rect x="52" y="370" width="12" height="80" rx="6" fill="#4285F4"/>
    <text x="84" y="419">Antigravity</text>
  </g>
  <text x="202" y="524" font-size="20" font-weight="700" fill="#1D4E89" text-anchor="middle">하네스 간 공유 메모리</text>

  <!-- panel 2: MEMORY.md card -->
  <g>
    <rect x="528" y="120" width="282" height="410" rx="18" fill="#2D333B"/>
    <text x="552" y="170" font-size="26" font-weight="700" fill="#FFFFFF">MEMORY.md</text>
    <g font-size="20" fill="#FFFFFF">
      <rect x="548" y="196" width="242" height="60" rx="10" fill="#3B434D"/>
      <text x="568" y="233">Hot</text>
      <rect x="548" y="270" width="242" height="60" rx="10" fill="#3B434D"/>
      <text x="568" y="307">목차 링크</text>
      <rect x="548" y="344" width="242" height="60" rx="10" fill="#3B434D"/>
      <text x="568" y="381">상위 폴더 안내</text>
      <rect x="548" y="440" width="242" height="68" rx="10" fill="#D97757"/>
      <text x="568" y="481" font-weight="700">Recent</text>
    </g>
  </g>

  <!-- panel 2: right cards -->
  <g>
    <rect x="880" y="120" width="222" height="118" rx="18" fill="#FFFFFF" stroke="#E8B79A" stroke-width="2"/>
    <text x="902" y="164" font-size="24" font-weight="700" fill="#1F2328">주제 목차</text>
    <text x="902" y="192" font-size="18" font-weight="600" fill="#3D444D" font-family="Consolas, 'D2Coding', monospace">indexes/</text>
    <rect x="902" y="208" width="150" height="8" rx="4" fill="#F2C3A8"/>
    <rect x="902" y="222" width="118" height="8" rx="4" fill="#F2C3A8"/>

    <rect x="880" y="276" width="222" height="146" rx="18" fill="#FFFFFF" stroke="#E8B79A" stroke-width="2"/>
    <text x="902" y="320" font-size="24" font-weight="700" fill="#1F2328">메모</text>
    <text x="902" y="348" font-size="18" font-weight="600" fill="#3D444D" font-family="Consolas, 'D2Coding', monospace">distilled/</text>
    <g fill="#7C5CFF">
      <path d="M902 368 h22 l8 8 v32 h-30 z"/><path d="M942 368 h22 l8 8 v32 h-30 z"/><path d="M982 368 h22 l8 8 v32 h-30 z"/>
    </g>
    <g fill="#FFFFFF" opacity="0.85">
      <rect x="908" y="384" width="16" height="3" rx="1.5"/><rect x="908" y="392" width="12" height="3" rx="1.5"/>
      <rect x="948" y="384" width="16" height="3" rx="1.5"/><rect x="948" y="392" width="12" height="3" rx="1.5"/>
      <rect x="988" y="384" width="16" height="3" rx="1.5"/><rect x="988" y="392" width="12" height="3" rx="1.5"/>
    </g>

    <rect x="880" y="460" width="222" height="70" rx="18" fill="#F3EFFF" stroke="#9A8CF0" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="902" y="503" font-size="21" font-weight="700" fill="#2E1A73">상위 폴더 메모리</text>
  </g>

  <!-- panel 2 arrows -->
  <g stroke="#24292F" stroke-width="2.2" fill="none">
    <path d="M790 300 H838 V180 H874" marker-end="url(#ah)"/>
    <path d="M991 238 V270" marker-end="url(#ah)"/>
    <path d="M790 374 H838 V495 H874" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  </g>

  <!-- panel 3: curate -->
  <g>
    <rect x="1228" y="120" width="320" height="100" rx="18" fill="#2D333B"/>
    <circle cx="1270" cy="170" r="20" fill="#FFC145"/>
    <circle cx="1280" cy="163" r="18" fill="#2D333B"/>
    <text x="1306" y="180" font-size="30" font-weight="700" fill="#FFFFFF">curate.py</text>
    <g font-size="21" font-weight="700" fill="#FFFFFF">
      <rect x="1250" y="250" width="276" height="50" rx="10" fill="#6FA85E"/>
      <text x="1272" y="283">목차 배치</text>
      <rect x="1250" y="312" width="276" height="50" rx="10" fill="#4F86C6"/>
      <text x="1272" y="345">나누기</text>
      <rect x="1250" y="374" width="276" height="50" rx="10" fill="#D9932E"/>
      <text x="1272" y="407">보관</text>
      <rect x="1250" y="436" width="276" height="50" rx="10" fill="#B9607F"/>
      <text x="1272" y="469">점검</text>
