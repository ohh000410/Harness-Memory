    <text x="1388" y="532" font-size="20" font-weight="700" fill="#1E5C30" text-anchor="middle">LLM 판단 · 코드 적용</text>
  </g>

  <!-- cross-panel arrows -->
  <g stroke="#24292F" stroke-width="2.4" fill="none">
    <path d="M348 170 H404 M348 290 H404 M348 410 H404 M404 170 V410"/>
    <path d="M404 290 H522" marker-end="url(#ah)"/>
    <path d="M202 572 V604 H610 V536" marker-end="url(#ah)"/>
    <path d="M1130 170 H1222" marker-end="url(#ah)"/>
    <path d="M1244 461 H1136" marker-end="url(#ah)"/>
  </g>
  <rect x="362" y="588" width="84" height="32" rx="16" fill="#FFFFFF" stroke="#24292F" stroke-width="2"/>
  <text x="404" y="611" font-size="20" font-weight="700" fill="#1F2328" text-anchor="middle">저장</text>
</svg>
